<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#010204" />
  <title>PIMXSATS — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #010204;
      color: #e5e7eb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    .icon { font-size: 3rem; margin-bottom: 1.5rem; }
    .brand {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
    }
    .brand span { color: #22d3ee; }
    .status {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #f87171;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.78rem;
      line-height: 1.7;
      color: #9ca3af;
      max-width: 24rem;
      margin-bottom: 2rem;
    }
    button {
      font: inherit;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #67e8f9;
      background: transparent;
      border: 1px solid rgba(34, 211, 238, 0.4);
      border-radius: 0.375rem;
      padding: 0.6rem 1.75rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover { background: rgba(34, 211, 238, 0.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📡</div>
    <div class="brand">PIMX<span>SATS</span></div>
    <div class="status">You're offline</div>
    <p>
      PIMXSATS can't reach the network right now. Once you've opened the tracker
      with a working connection, it's stored on this device and will start
      instantly — even offline. Check your connection and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
